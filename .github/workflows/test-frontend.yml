name: Testes Frontend (UI)

on:
  push:
    branches:
      - '**'

jobs:
  test-frontend:
    name: Cypress — Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Cypress
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-binary-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar dependências
        run: npm ci

      - name: Instalar binário do Cypress
        run: |
          npx cypress install --force
          # Garante permissões do binário
          chmod -R +x ~/.cache/Cypress

      - name: Iniciar servidor em background
        run: node backend/server.js &

      - name: Aguardar servidor estar pronto
        run: npx wait-on http://localhost:3000/health --timeout 30000 --interval 500

      - name: Executar testes do Frontend
        run: npx cypress run --spec "cypress/e2e/frontend.cy.js" --headless --browser electron

      - name: Upload de screenshots em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-frontend
          path: cypress/screenshots

      - name: Upload de vídeos em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos-frontend
          path: cypress/videos
